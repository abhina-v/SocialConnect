spring:
  application:
    name: interest-connect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interest_connect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
  expiration: 86400000

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
