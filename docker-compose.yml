version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: interest-connect-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: interest_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: interest-connect-app
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/interest_connect
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    ports:
      - "8080:8080"

volumes:
  postgres-data: